    i.scores = { ...(i.scores || {}) };
    if (i.scores[t] === v) delete i.scores[t]; else i.scores[t] = v;
    await save(i); render();
  },
  exportBackup: doExport,
  syncConnect: () => syncConnect(), syncDisconnect: () => syncDisconnect(), syncNow: () => syncNow({ interactive: true }),
  pickMain: el => pickMainSheet(el.dataset.id),
  reviseGoal: el => reviseGoalSheet(el.dataset.id),
  friendShare: el => friendShare(el.dataset.id), propagate: el => propagateSheet(el.dataset.id),
  newOffer: el => offerSheet({ itemId: el.dataset.item }), editOffer: el => offerSheet({ id: el.dataset.id }), shareOffer: el => shareOffer(el.dataset.id), offerSent: el => offerSentSheet(el.dataset.id),
  offersImage: async () => { const list = all('offer').filter(o => o.status === 'open' && get(o.itemId)); if (!list.length) return; busy(true); try { const blob = await catalogueCard(list); shareSheet({ blob, caption: offersText(list), name: `lineage-available-${today()}.png` }); } finally { busy(false); } },
  offersText: async () => { const list = all('offer').filter(o => o.status === 'open' && get(o.itemId)); toast((await copyText(offersText(list))) ? 'List copied. Paste it into your group or post' : 'Copy failed'); },
  offersPrint: () => { const list = all('offer').filter(o => o.status === 'open' && get(o.itemId)); const html = catalogueHTML(list); const w = window.open('', '_blank'); if (w) { w.document.open(); w.document.write(html); w.document.close(); } else download(new Blob([html], { type: 'text/html' }), `lineage-catalogue-${today()}.html`); },
  setKeeps: async el => { S.settings.keeps = el.dataset.v; await saveSettings(); location.hash = '#/?step=2'; },
  setLevel: async el => { S.settings.level = el.dataset.v; await finishSetup(); },
  planAdd: el => planItemSheet(el.dataset.season), planEdit: el => planItemSheet(el.dataset.season, +el.dataset.k), planSown: el => planSownSheet(el.dataset.season, +el.dataset.k),
  crossDoneToday: async el => { const c = get(el.dataset.id); c.status = 'Done'; c.date = today(); const gf = goalFor(get(c.projectId)); if (gf) c.goalV = gf.g.v; await save(c); toast('Marked as done today'); render(); },
  share: el => shareRecord(el.dataset.id),
  impPick: async () => { const files = await pickFiles(false, '.csv,.json,.zip,.txt,text/csv,application/json,application/zip', true); if (!files.length) return; const items = []; for (const f of files) items.push(/\.zip$/i.test(f.name) ? { name: f.name, blob: f } : { name: f.name, text: await f.text() }); await impAddSources(items); },
  impPaste: async () => { const t = $('#impPaste').value.trim(); if (!t) { toast('Paste something first'); return; } await impAddSources([{ name: 'Pasted text', text: t }]); $('#impPaste').value = ''; },
  impCommit: () => impCommit(), impUndo: () => impUndo(), impReset: () => { IMP.sources = []; IMP.plan = null; render(); },
  newSite: () => siteSheet({}), editSite: el => siteSheet({ id: el.dataset.id }),
  newReading: el => readingSheet({ siteId: el.dataset.site || '' }), editReading: el => readingSheet({ id: el.dataset.id }),
  wxUpdate: async el => { const s = get(el.dataset.id); busy(true); try { await updateWeather(s, { full: !wxOf(s) }); toast('Weather updated'); render(); } catch (e) { toast(e.message); } finally { busy(false); } },
  newPlace: el => placeSheet({ preset: P(el) }), editPlace: el => placeSheet({ id: el.dataset.id }),
  newGerm: el => germSheet({ lotId: el.dataset.lot }), editGerm: el => germSheet({ id: el.dataset.id }),
  newReminder: el => reminderSheet({ refId: el.dataset.ref || '' }), editReminder: el => reminderSheet({ id: el.dataset.id }),
  dueGo: el => dueGo(el.dataset.key), dueMenu: el => dueMenu(el.dataset.key),
  calBatch: el => { const span = +el.dataset.span || 7; const its = dueItems().filter(i => i.days <= span); if (!its.length) { toast('Nothing due in that time'); return; } download(new Blob([icsFor(its)], { type: 'text/calendar' }), `lineage-due-${today()}.ics`); toast(`${its.length} item${its.length === 1 ? '' : 's'} saved. Open the file to add them`); },
  loadExample: el => loadExample(el.dataset.ex),
  removeExamples: () => removeExamples(),
  undoRestore,
  newEntry: el => entrySheet({ rtId: el.dataset.rt, indId: el.dataset.ind, parentEntryId: el.dataset.parent || '' }),
  editEntry: el => entrySheet({ id: el.dataset.id }),
  addRt: el => suggestSheet(el.dataset.project),
  editRt: el => recordTypeSheet({ rtId: el.dataset.rt }),
  bulk: el => bulkSheet({ projectId: el.dataset.project, rtId: el.dataset.rt }),
  binRestore: async el => { const n = await restoreBatch(el.dataset.batch); toast(`Restored ${n} record${n === 1 ? '' : 's'}`); render(); },
  binPurge: async el => { if (!syncTyped('DELETE', 'Delete these records for good? This can’t be undone.')) return; await purgeBatch(el.dataset.batch); await cleanOrphanPhotos(); toast('Deleted for good'); render(); },
  importBackup: async el => {
    const [file] = await pickFiles(false, '.zip,.json,application/zip,application/json'); if (!file) return;
    if (/\.json$/i.test(file.name)) { try { const d = JSON.parse(await file.text()); if (d.format === 'friendly') { IMP.sources = [{ name: file.name, type: 'friendly', data: d }]; impReplan(); location.hash = '#/import'; toast('Check what will be added, then import'); return; } } catch {} }
    const replace = el.dataset.mode === 'replace';
    if (replace && !syncTyped('REPLACE', 'Replace every record with this backup? Records missing from the backup go to the recycle bin.')) return;
    busy(true);
    try { const n = await doImport(file, replace); toast(`Restored: ${n}`); render(); } catch (e) { alert(e.message); } finally { busy(false); }
  },
  wipe: async () => {
    if (prompt(`Type ERASE to delete every record and photo on this device.${S.sync?.enabled ? ' Sync will be turned off on this device first; your Google Drive copy is not touched.' : ''}`) !== 'ERASE') return;
    if (S.sync?.enabled) { S.sync.enabled = false; await saveSync(); setSyncState('off'); }
    await DB.clear('records'); await DB.clear('photos'); await DB.del('meta', 'undo'); S.recs.clear(); urlCache.clear(); invalidateCaches(); S.undoAt = null;
    toast('Everything erased'); location.hash = '#/'; render();
  },
  testAI: async () => {
    busy(true);
    try { await callClaude([{ type: 'text', text: 'Reply with the single word: ready' }], 10); toast('Connected to Claude'); }
    catch (e) { alert(e.message); } finally { busy(false); }
  },
  askRun: async () => {
    const q = $('#askQ').value.trim(); if (!q) { toast('Type a question first'); return; }
    const out = $('#askOut'); out.textContent = 'Thinking...'; busy(true);
    try { out.innerHTML = renderAnswer(await callClaude([{ type: 'text', text: askPrompt(q) }], 1500)); }
    catch (e) { out.textContent = e.message; } finally { busy(false); }
  },
  askCopy: async () => {
    const q = $('#askQ').value.trim(); if (!q) { toast('Type a question first'); return; }
    toast((await copyText(askPrompt(q))) ? 'Copied. Paste it into Claude or ChatGPT' : 'Copy failed on this browser');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el)).catch(err => { console.error(err); toast(err.message || 'Something went wrong'); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lb = $('.lb'); if (lb) { lb.remove(); return; }
  closeSheet();
});

/* ---------- Router ---------- */
const PAGES = { '': pHome, library: pLibrary, strain: pStrain, lot: pLot, tagged: pTagged, ind: pInd, projects: pProjects, project: pProject, cross: pCross, log: pLog, ask: pAsk, settings: pSettings, bin: pBin, place: pPlace, due: pDue, tree: pTree, goal: pGoal, weather: pWeather, site: pSite, import: pImport, check: pCheck, plan: pPlan, labels: pLabels, planner: pPlanner, session: pSession, offers: pOffers };
const TAB_OF = { '': 'home', library: 'library', strain: 'library', lot: 'library', place: 'library', tagged: 'tagged', ind: 'tagged', projects: 'projects', project: 'projects', cross: 'projects', tree: 'projects', due: 'home', goal: 'projects', weather: 'home', site: 'home', import: 'home', check: 'home', plan: 'plan', labels: 'library', planner: 'projects', session: 'projects', offers: 'home' };
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function render() {
  const { parts, q } = parseHash();
  const root = PAGES[parts[0]] ? parts[0] : '';
  const main = $('#main');
  let html;
  const inSetup = !S.settings.setupDone && !liveCount() && root === '';
  document.body.classList.toggle('setup-page', inSetup);
  try { html = inSetup ? pSetup(null, q) : PAGES[root](parts[1], q); } catch (e) { console.error(e); html = `<div class="notice warn">This page hit a problem: ${h(e.message)}</div>`; }
  main.innerHTML = html;
  hydrate(main);
  const t4 = on('projects') ? ['projects', '#/projects', 'project', 'Projects'] : on('plan') ? ['plan', '#/plan', 'cal', 'Plan'] : ['due', '#/due', 'clock', 'Due'];
  const tab4 = $('#tab4'); if (tab4 && tab4.dataset.tab !== t4[0]) { tab4.dataset.tab = t4[0]; tab4.href = t4[1]; tab4.innerHTML = ic(t4[2]) + t4[3]; }
  const tab2 = $('#tab2'); if (tab2) tab2.innerHTML = ic('library') + word('libraryTab');
  const tab3 = $('#tab3'); if (tab3) tab3.innerHTML = ic('tag') + word('taggedTab');
  const tab = root === 'due' && t4[0] === 'due' ? 'due' : TAB_OF[root];
  $$('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#backBtn').hidden = !parts[1] && !['log', 'ask', 'settings', 'bin', 'due', 'weather', 'import', 'check', 'labels', 'planner', 'offers'].includes(root) && !(root === 'plan' && !on('projects'));
  document.body.classList.toggle('tree-page', root === 'tree');
  document.title = root ? `${(main.querySelector('h1')?.textContent || 'Lineage Tracker').trim()} | Lineage Tracker` : 'Lineage Tracker';
  mountPage(root, parts);
}
function mountPage(root, parts = []) {
  if (root === 'site') mountSite(parts[1]);
  if (root === 'check') mountCheck();
  if (root === 'labels') mountLabels();
  if (root === 'import') mountImport();
  const main = $('#main');
  const filter = $('input[data-filter]', main);
  if (filter) filter.addEventListener('input', () => {
    const t = filter.value.toLowerCase().trim();
    $$('[data-s]', main).forEach(el => { el.hidden = !!t && !el.dataset.s.includes(t); });
    $$('[data-grp]', main).forEach(g => { g.hidden = !$$('[data-s]:not([hidden])', g).length; });
  });
  if (root === 'tree') mountTree();
  if (root === 'settings') {
    mountSyncSettings();
    mountModeSettings();
    mountOffersSettings();
    $('#shareForm')?.addEventListener('change', async e => { S.settings.shareCredit = e.target.checked; await saveSettings(); toast('Saved'); });
    $('#dueForm').addEventListener('submit', async e => {
      e.preventDefault();
      const d = formData(e.target);
      const n = (v, def, min, max) => { const x = parseInt(v, 10); return isFinite(x) ? Math.max(min, Math.min(max, x)) : def; };
      Object.assign(S.settings, { fruitSetDays: n(d.fruitSetDays, 10, 1, 60), storageDays: n(d.storageDays, 30, 1, 365), germThreshold: n(d.germThreshold, 75, 1, 100), germRetestMonths: n(d.germRetestMonths, 12, 1, 120), calendar: !!d.calendar });
      await saveSettings(); toast('Saved'); render();
    });
    (async () => {
      const el = $('#storeInfo'); if (!el) return;
      try {
        const persisted = await navigator.storage?.persisted?.();
        const est = await navigator.storage?.estimate?.();
        const used = est?.usage ? `${(est.usage / 1048576).toFixed(1)} MB used on this device. ` : '';
        el.textContent = used + (persisted ? 'The browser has agreed not to clear this data on its own.' : 'The browser may clear this data if the device runs low on space, which is another reason to keep backups. Installing Lineage Tracker to your home screen usually changes this.');
      } catch {}
    })();
    $('#themeSel').addEventListener('change', async e => { S.settings.theme = e.target.value; applyTheme(); await saveSettings(); });
    const f = $('#aiForm');
    f.addEventListener('change', e => { if (e.target.name === 'ai') { $('#apiFields').hidden = e.target.value !== 'api'; $('#testBtn').hidden = e.target.value !== 'api'; } });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      S.settings.ai = f.querySelector('input[name=ai]:checked')?.value || 'off';
      S.settings.apiKey = f.elements.apiKey.value.trim();
      S.settings.model = f.elements.model.value.trim() || DEFAULT_MODEL;
      await saveSettings(); toast('Settings saved');
    });
  }
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- Start ---------- */
async function init() {
  $('#backBtn').innerHTML = ic('back');
  $('#logBtn').innerHTML = ic('log');
  $('#setBtn').innerHTML = ic('gear');
  $('.tabs .cap').innerHTML = ic('plus');
  for (const [tab, icon, label] of [['home', 'home', 'Home'], ['library', 'library', 'Library'], ['tagged', 'tag', 'Tagged'], ['projects', 'project', 'Projects']]) $(`.tabs a[data-tab="${tab}"]`).innerHTML = ic(icon) + label;
  try { await DB.open(); await loadWeatherCache(); }
  catch {
    $('#main').innerHTML = '<div class="notice warn">This browser blocked local storage, so Lineage Tracker can\'t save records here. Try Chrome, Edge or Firefox, or open Lineage Tracker from a web address instead of a file.</div>';
    return;
  }
  const [recs, meta] = [await DB.all('records'), await DB.get('meta', 'settings')];
  recs.forEach(r => S.recs.set(r.id, r));
  if (meta) { const { key, ...rest } = meta; Object.assign(S.settings, rest); }
  S.undoAt = (await DB.get('meta', 'undo'))?.at || null;
  S.dueState = (await DB.get('meta', 'dueState'))?.state || {};
  { const li = await DB.get('meta', 'lastImport'); if (li) { const { key, ...rest } = li; S.lastImport = rest; } }
  const migrate = [];
  for (const r of S.recs.values()) if (r.type === 'stock' && r.qty == null && r.quantity) { const q = parseQty(r.quantity); if (q) { r.qty = q.qty; r.unit = r.unit || q.unit; delete r.quantity; migrate.push(r); } }
  migrate.push(...migrateGoals());
  if (!S.settings.setupDone && S.recs.size) { S.settings.setupDone = true; S.settings.level = S.settings.level || 'breeder'; S.settings.keeps = S.settings.keeps || 'both'; await saveSettings(); }
  if (migrate.length) await DB.putMany('records', migrate);
  applyTheme();
  lastPath = location.hash.split('?')[0];
  render();
  purgeOldBin().catch(() => {});
  initSync().then(() => { if (parseHash().parts[0] === 'settings') render(); }).catch(e => console.error(e));
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
let lastPath = '';
window.addEventListener('hashchange', () => {
  closeSheet(); $('.lb')?.remove(); render();
  const path = location.hash.split('?')[0];
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
});
init();
</script>
