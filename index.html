<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12191C" media="(prefers-color-scheme: dark)">
<meta name="description" content="A local-first breeding journal for plants and animals.">
<title>Lineage</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --paper:#F2F4EE;--card:#FFFFFF;--sunk:#E6EAE2;--ink:#1D2A33;--muted:#56646A;--line:#D2D9CF;
  --tag:#F2B01E;--tag-ink:#1D2A33;--leaf:#2F6B4F;--dam:#8E4A8A;--sire:#2B7487;--warn:#A3352A;--warn-bg:#F7E2DC;
  --f-tag:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#12191C;--card:#1A2428;--sunk:#0D1315;--ink:#E6ECE5;--muted:#9AA8A6;--line:#2B383C;--tag:#F0AE2A;--leaf:#76C39A;--dam:#C98BC5;--sire:#6CB8CB;--warn:#F2907F;--warn-bg:#3A2220;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#12191C;--card:#1A2428;--sunk:#0D1315;--ink:#E6ECE5;--muted:#9AA8A6;--line:#2B383C;--tag:#F0AE2A;--leaf:#76C39A;--dam:#C98BC5;--sire:#6CB8CB;--warn:#F2907F;--warn-bg:#3A2220;color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
a{color:var(--leaf);text-underline-offset:2px}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-tag);font-weight:600;line-height:1.08;margin:0 0 .35em;letter-spacing:.005em}
h1{font-size:2.15rem}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0 0 .8em}
i.sp,.sp{font-style:italic}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sire);outline-offset:2px}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .flex{flex:1}
.brand{text-decoration:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:16px 16px 24px}

/* The tag: plant stake and ear tag in one. The app's one loud element. */
.tag{display:inline-flex;align-items:center;gap:.42em;background:var(--tag);color:var(--tag-ink);font:700 1.05rem/1 var(--f-tag);letter-spacing:.03em;padding:.34em .78em .34em .5em;border-radius:.3em 1em 1em .3em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag::before{content:"";flex:none;width:.46em;height:.46em;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag.sm{font-size:.85rem}
.tag.xl{font-size:clamp(2.2rem,11vw,3.2rem);padding:.2em .62em .2em .38em}
.tag.xl.long{font-size:clamp(1.5rem,7.4vw,2.6rem)}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:760px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media(min-width:780px){.tabs{border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:.74rem;color:var(--muted);text-decoration:none;border-radius:var(--r-sm)}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs .cap{justify-self:center;width:64px;height:64px;margin-top:-28px;border-radius:50%;display:grid;place-items:center;background:var(--tag);color:var(--tag-ink);border:4px solid var(--paper);box-shadow:0 8px 18px -8px rgba(0,0,0,.45);cursor:pointer;padding:0}
.tabs .cap svg{width:30px;height:30px}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem/1.1 var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.tagc{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.btn.danger{color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.actions.tight{margin:0}
.linkish{border:0;background:none;padding:0 2px;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;line-height:1.5;color:var(--muted);background:transparent;text-decoration:none;white-space:nowrap}
.chip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.chip.ok{color:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 45%,transparent)}
a.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}

/* Sections */
.sec{margin:30px 0 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.sec-head h2{margin:0}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.page-head h1{margin:0}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r-lg);text-align:center;color:var(--muted)}
.empty .btn{margin-top:4px}
.notice{border-radius:var(--r-md);padding:10px 14px;margin:0 0 12px;font-size:.93rem;background:var(--sunk)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.prose{max-width:62ch;white-space:pre-wrap}
.goal{font-size:1.08rem;max-width:58ch;white-space:pre-wrap}

/* Home */
.today{margin:0 0 10px;color:var(--muted)}
.capture-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.cap-btn{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:100px;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.cap-btn svg{width:26px;height:26px}
.cap-btn b{display:block;font:600 1.3rem/1.05 var(--f-tag)}
.cap-btn small{display:block;margin-top:4px;font-size:.85rem;opacity:.8}
.cap-btn.big{grid-row:span 2;background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.cap-btn.big b{font-size:1.75rem}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.pcard{flex:0 0 230px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none}
.pcard .tag{align-self:flex-start}
.pcard .n{font:600 1.35rem/1.05 var(--f-tag)}
.pcard .tag{align-self:flex-start}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem;color:var(--muted);margin:0}
.ask-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none}
.ask-card svg{width:28px;height:28px;flex:none;color:var(--leaf)}
.ask-card b{display:block}
.ask-card small{color:var(--muted)}
.welcome{padding:8px 0 4px}
.welcome h1{font-size:2.4rem;margin-top:16px;max-width:16ch}
.welcome p{max-width:52ch}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:var(--r-md);color:inherit;text-decoration:none}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.87rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{align-self:flex-start}
.row .nm{font-weight:700}
.thumb{flex:none;width:54px;height:54px;border-radius:var(--r-sm);object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:24px;height:24px}
.grp{margin:0 0 14px}
.grp h3{color:var(--muted);font-size:1.05rem;margin:14px 8px 4px}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.meter{display:block;width:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf)}

/* Search and segmented control */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;margin:0 0 4px}
.seg a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.seg a[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.searchbar{position:relative;margin:10px 0}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.searchbar input{padding-left:40px}

/* Detail pages */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:4px 0 6px}
.hero h1{margin:0}
.hero .sub{color:var(--muted);margin:0}
.nick{font:600 1.35rem/1.1 var(--f-tag);margin:2px 0 0}
.cover{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:var(--r-lg);background:var(--sunk);margin:0 0 14px;cursor:zoom-in}
.empty-cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:150px;border:1.5px dashed var(--line);color:var(--muted);font:inherit;cursor:pointer}
.empty-cover svg{width:30px;height:30px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:14px 0}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}

/* Log timeline */
.log{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.log li{position:relative;padding:0 0 20px 18px}
.log li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf)}
.log .d{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.log .txt{white-space:pre-wrap;margin:4px 0 0;max-width:62ch}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.ph-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm);background:var(--sunk);cursor:zoom-in}

/* Pedigree */
.ped-wrap{overflow-x:auto;padding:4px 2px 10px}
.ped{display:flex;align-items:center}
.ped-par{display:flex;flex-direction:column;gap:8px;margin-left:16px;padding-left:16px;border-left:2px solid var(--line)}
.ped-side{position:relative}
.ped-side::before{content:"";position:absolute;left:-16px;top:50%;width:14px;border-top:2px solid var(--line)}
.ped-node{flex:none;display:block;min-width:118px;max-width:170px;padding:6px 10px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);font-size:.82rem;color:inherit;text-decoration:none}
.ped-node .c{display:block;font:700 1.02rem/1.1 var(--f-tag);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped-node .r{color:var(--muted)}
.ped-node.unknown{color:var(--muted);border-style:dashed}
.ped-side.dam>.ped>.ped-node{border-left:4px solid var(--dam)}
.ped-side.sire>.ped>.ped-node{border-left:4px solid var(--sire)}
.ped-key{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.ped-key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ped-key .k-dam::before{background:var(--dam)}
.ped-key .k-sire::before{background:var(--sire)}

/* Scores */
.tier-h{font-size:1rem;color:var(--muted);margin:14px 0 2px}
.trait{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pips{display:flex;gap:4px}
.pips button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:700 .88rem var(--f-body);cursor:pointer}
.pips button.on{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.rank{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);text-decoration:none;color:inherit}
.rank:hover{background:var(--sunk)}
.rank .main{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* Projects */
.proj{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);margin:0 0 12px;overflow:hidden}
.proj-main{display:block;padding:16px;color:inherit;text-decoration:none}
.proj-main h2{margin:0 0 2px}
.proj-main p{margin:0 0 6px}
.lines{list-style:none;margin:0;padding:8px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lines a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700}

/* Sheets (forms) */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,16,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-back{opacity:1}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px;background:var(--paper)}
.sheet-head h2{margin:0}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:5vh;width:min(640px,94vw);max-height:90vh;border-radius:var(--r-lg);transform:translate(-50%,16px);opacity:0;transition:transform .2s,opacity .2s}
  .sheet-wrap.open .sheet{transform:translate(-50%,0);opacity:1}
}
.sheet-actions{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin-bottom:0}
.cap-list{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.cap-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cap-item svg{width:26px;height:26px;flex:none}
.cap-item b{display:block}
.cap-item small{color:var(--muted)}
.cap-item:first-child{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.cap-item:first-child small{color:inherit;opacity:.8}

/* Form fields */
.fld{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;min-width:0}
.fld>span{font-size:.86rem;font-weight:700}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:90px}
input[type="search"]{-webkit-appearance:none;appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--leaf)}
.hint{font-size:.86rem;color:var(--muted);margin:-4px 0 12px}
.ph-t{position:relative}
.ph-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ph-x svg{width:16px;height:16px}
.pickbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--card);margin:0 0 12px}
.pickbox .chk{margin:0;padding:5px 0}
.tr-row{display:grid;grid-template-columns:1fr 92px auto 36px;gap:6px;align-items:center;margin:0 0 6px}
.tr-row .chk{margin:0;font-size:.85rem}
.radios{border:0;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);cursor:pointer}
.radio input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none;accent-color:var(--leaf)}
.radio small{display:block;color:var(--muted)}
.manual{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:0 0 14px;background:var(--card)}
.manual ol{margin:6px 0 10px;padding-left:20px}
.manual textarea{margin:10px 0}
.answer{margin-top:16px;max-width:62ch}
.answer:empty{display:none}


/* Records, record types and comparison */
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.sm svg{width:16px;height:16px}
.rt-block{margin:0 0 18px}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.rt-head h3{margin:0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:10px 12px}
.item-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item-head .linkish{margin-left:auto}
.vals{margin:4px 0 0;font-size:.92rem}
.trial{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.92rem}
.trial>div{flex-basis:100%}
.rt-def{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 8px;border-bottom:1px solid var(--line)}
.rt-def .main{flex:1;min-width:200px;display:flex;flex-direction:column}
.rt-def .t{font-weight:700}
.rt-def .s{font-size:.87rem;color:var(--muted)}
.fd{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:8px;margin:0 0 8px}
.fd-top{display:grid;grid-template-columns:1fr 130px 40px;gap:6px;align-items:center}
.fd-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fd-more input,.fd-more select{flex:1 1 160px}
.fd-more .chk{margin:0;flex:1 1 160px;font-size:.88rem}
.fd-more .chk input{flex:none}
.fd-more .fd-agg{flex:1 1 220px}
.pip{position:relative;display:inline-grid}
.pip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;min-height:0;cursor:pointer}
.pip span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);font-weight:700}
.pip input:checked+span{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.pip input:focus-visible+span{outline:3px solid var(--sire);outline-offset:2px}
.pips .linkish{align-self:center;width:auto;height:auto;margin-left:6px;border:0;border-radius:0;background:none}
output.calc{display:block;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk);font-weight:700}
output.calc.empty{font-weight:400;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
table.cmp{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp thead th{font-size:.8rem;vertical-align:bottom;white-space:normal;min-width:84px}
table.cmp thead th a{color:var(--muted);text-decoration:none}
table.cmp thead th a[aria-sort]{color:var(--ink)}
table.cmp tbody th,table.cmp thead th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.cmp tbody th a{font-weight:700;color:var(--ink)}
table.cmp td.flag{color:var(--warn);font-weight:700}
table.cmp tbody tr:last-child>*{border-bottom:0}
.bulk-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bulk-row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.bulk-row .t{font-weight:700}
.bulk-row .s{font-size:.85rem;color:var(--muted)}
.bulk-row select{width:auto;flex:0 0 46%}
.cap-item.plain{background:var(--card)!important;border-color:var(--line)!important;color:var(--ink)!important}
.cap-item.plain small{color:var(--muted)!important;opacity:1!important}
.cap-item[disabled]{opacity:.55;cursor:default}
details summary{cursor:pointer}

/* Lightbox, toast, busy */
.lb{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.92);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:90vw;padding:10px 18px;border-radius:22px;text-align:center;background:var(--ink);color:var(--paper);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
body.busy::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:50;background:linear-gradient(90deg,transparent,var(--tag),transparent);background-size:50% 100%;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (max-width:380px){.two{grid-template-columns:1fr}.capture-grid{grid-template-columns:1fr}.cap-btn.big{grid-row:auto}}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="backBtn" data-act="back" aria-label="Back" hidden></button>
  <a class="brand" href="#/" aria-label="Lineage home"><span class="tag">Lineage</span></a>
  <span class="flex"></span>
  <a class="icon-btn" id="logBtn" href="#/log" aria-label="Full log"></a>
  <a class="icon-btn" id="setBtn" href="#/settings" aria-label="Settings"></a>
</header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Main">
  <a href="#/" data-tab="home"></a>
  <a href="#/library" data-tab="library"></a>
  <button class="cap" data-act="capture" aria-label="Add something"></button>
  <a href="#/tagged" data-tab="tagged"></a>
  <a href="#/projects" data-tab="projects"></a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const VERSION = '0.2';
const DEFAULT_MODEL = 'claude-haiku-4-5-20251001';

/* ---------- Icons ---------- */
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  library: '<path d="M7 3h10l-1 4H8z"/><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M12 11c-2.2 2.2-2.2 5 0 7 2.2-2 2.2-4.8 0-7z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.6"/>',
  project: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10"/><path d="M18 10c0 4-4 5-11 7.5"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
  note: '<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/>',
  cross: '<circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  log: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;

/* ---------- Small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pre = o => h(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function fmtDate(s) {
  if (!s) return '';
  const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(s);
  if (!m) return s;
  const d = new Date(+m[1], +m[2] - 1, +(m[3] || 1));
  return d.toLocaleDateString(undefined, m[3] ? { day: 'numeric', month: 'short', year: 'numeric' } : { month: 'short', year: 'numeric' });
}
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' });
const byCode = (a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true, sensitivity: 'base' });
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0);
function groupBy(arr, fn) { const o = {}; for (const x of arr) (o[fn(x)] ||= []).push(x); return o; }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function busy(on) { document.body.classList.toggle('busy', !!on); }

/* ---------- Storage (IndexedDB, on this device only) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('lineage', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore('records', { keyPath: 'id' });
        db.createObjectStore('photos', { keyPath: 'id' });
        db.createObjectStore('meta', { keyPath: 'key' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage is full or blocked'));
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },
  get(s, id) { return this.tx(s, 'readonly', st => st.get(id)); },
  put(s, o) { return this.tx(s, 'readwrite', st => st.put(o)); },
  del(s, id) { return this.tx(s, 'readwrite', st => st.delete(id)); },
  clear(s) { return this.tx(s, 'readwrite', st => st.clear()); },
  putMany(s, arr) { return this.tx(s, 'readwrite', st => { arr.forEach(o => st.put(o)); }); },
};

const S = {
  recs: new Map(),
  settings: { theme: 'auto', ai: 'off', apiKey: '', model: DEFAULT_MODEL, lastExport: null },
};
const all = type => { const out = []; for (const r of S.recs.values()) if (r.type === type && !r.deletedAt) out.push(r); return out; };
const get = id => { const r = id ? S.recs.get(id) : undefined; return r && !r.deletedAt ? r : undefined; };
let _noteIdx = null;
function notesFor(id) {
  if (!_noteIdx) {
    _noteIdx = new Map();
    for (const n of all('note')) { if (!_noteIdx.has(n.refId)) _noteIdx.set(n.refId, []); _noteIdx.get(n.refId).push(n); }
    for (const a of _noteIdx.values()) a.sort(byDateDesc);
  }
  return _noteIdx.get(id) || [];
}
async function save(r) {
  const now = Date.now();
  r.updatedAt = now; if (!r.createdAt) r.createdAt = now;
  S.recs.set(r.id, r); _noteIdx = null; _rtIdx = null;
  await DB.put('records', r);
  return r;
}
/* Deleting moves a record, and everything that only makes sense with it, to the recycle bin */
async function removeRec(id) {
  const ids = new Set([id]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const r of S.recs.values()) {
      if (r.deletedAt || ids.has(r.id)) continue;
      if ((r.type === 'note' && ids.has(r.refId)) || (r.type === 'entry' && (ids.has(r.indId) || ids.has(r.parentEntryId)))) { ids.add(r.id); grew = true; }
    }
  }
  const now = Date.now(), batch = uid(), changed = [];
  for (const x of ids) { const r = S.recs.get(x); if (!r) continue; Object.assign(r, { deletedAt: now, delBatch: batch, delRoot: id, updatedAt: now }); changed.push(r); }
  await DB.putMany('records', changed);
  _noteIdx = null; _rtIdx = null;
  return changed.length;
}
async function saveSettings() { await DB.put('meta', { ...S.settings, key: 'settings' }); }

/* ---------- Photos: compressed on the device, stored as blobs ---------- */
const urlCache = new Map();
async function photoURL(id, thumb) {
  const k = id + (thumb ? ':t' : ':f');
  if (urlCache.has(k)) return urlCache.get(k);
  const p = await DB.get('photos', id);
  if (!p) return '';
  const u = URL.createObjectURL(thumb ? (p.thumb || p.full) : p.full);
  urlCache.set(k, u); return u;
}
function hydrate(root = document) {
  $$('img[data-photo]', root).forEach(async img => {
    if (img.src) return;
    const u = await photoURL(img.dataset.photo, img.dataset.full !== '1');
    if (u) img.src = u;
  });
}
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    return await new Promise((res, rej) => {
      const u = URL.createObjectURL(file); const im = new Image();
      im.onload = () => res(im); im.onerror = () => rej(new Error('That file is not an image this browser can open'));
      im.src = u;
    });
  }
}
function shrink(src, max, q) {
  const w0 = src.width, h0 = src.height, sc = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
async function addPhoto(file) {
  const bmp = await loadBitmap(file);
  const full = await shrink(bmp, 1600, 0.82);
  const thumb = await shrink(bmp, 480, 0.78);
  const id = uid();
  await DB.put('photos', { id, full, thumb, at: Date.now() });
  return id;
}
function pickFiles(camera, accept = 'image/*') {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept;
    if (camera) i.setAttribute('capture', 'environment'); else if (accept === 'image/*') i.multiple = true;
    i.style.display = 'none'; document.body.appendChild(i);
    i.addEventListener('change', () => { res([...i.files]); i.remove(); });
    i.click();
  });
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(u) {
  const [head, b64] = u.split(',');
  const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

/* ---------- Domain helpers: plants and animals ---------- */
const WORDS = {
  plant: { start: 'Sown', lot: 'Seed lot', lots: 'Seed lots', ind: 'plant', startHatch: 'Sow from this lot' },
  animal: { start: 'Born or hatched', lot: 'Stock lot', lots: 'Stock lots', ind: 'animal', startHatch: 'Hatch or birth from this lot' },
};
const LOT_STATUS = { active: 'In use', archive: 'Archive backup', used: 'Used up' };
const IND_STATUS = ['Active', 'Selected', 'Kept for breeding', 'Harvested', 'Culled', 'Sold or rehomed', 'Died'];
const CROSS_METHODS = ['Hand-pollinated', 'Self-pollinated', 'Open-pollinated', 'Natural mating', 'Artificial insemination', 'Other'];
const CROSS_STATUS = ['Planned', 'Done', 'Successful', 'Failed'];

function kindOf(r, depth = 0) {
  if (!r || depth > 4) return 'plant';
  if (r.kind) return r.kind;
  const s = get(r.strainId); if (s) return kindOf(s, depth + 1);
  const p = get(r.projectId); if (p) return kindOf(p, depth + 1);
  const l = get(r.stockId); if (l) return kindOf(l, depth + 1);
  return 'plant';
}
const W = r => WORDS[kindOf(r)] || WORDS.plant;

function title(r) {
  if (!r) return 'Unknown';
  switch (r.type) {
    case 'individual': return r.code || r.name || 'Untagged';
    case 'strain': case 'project': return r.name || 'Unnamed';
    case 'stock': {
      if (r.label) return r.label;
      const s = get(r.strainId); if (s) return s.name;
      const c = get(r.crossId); if (c) return crossTitle(c) + ' seed';
      return 'Unnamed lot';
    }
    case 'cross': return crossTitle(r);
    case 'note': return 'Note';
  }
  return 'Record';
}
const shortName = r => (r ? (r.type === 'individual' ? (r.code || r.name) : title(r)) : '?');
const crossTitle = c => `${shortName(get(c.motherId))} × ${shortName(get(c.fatherId))}`;
function link(r) {
  if (!r) return '#/';
  const base = { strain: '#/strain/', stock: '#/lot/', individual: '#/ind/', project: '#/project/', cross: '#/cross/' }[r.type];
  if (base) return base + r.id;
  if (r.type === 'note') return link(get(r.refId));
  return '#/';
}
function findStrain(name) {
  const n = (name || '').trim().toLowerCase(); if (!n) return null;
  return all('strain').find(s => (s.name || '').trim().toLowerCase() === n) || null;
}

/* Species: used to warn before a cross between species */
function speciesOf(r, depth = 0) {
  if (!r || depth > 4) return '';
  if (r.type === 'strain' || r.type === 'project') return r.species || '';
  const s = get(r.strainId); if (s?.species) return s.species;
  const l = get(r.stockId); if (l) { const x = speciesOf(l, depth + 1); if (x) return x; }
  const p = get(r.projectId); if (p?.species) return p.species;
  return '';
}
function verifiedOf(r) {
  if (!r) return true;
  if (r.type === 'strain') return !!r.speciesVerified;
  const s = get(r.strainId); if (s) return !!s.speciesVerified;
  return true;
}
function spKey(s) {
  const parts = (s || '').toLowerCase().replace(/[^a-z\s.]/g, ' ').split(/[\s.]+/).filter(Boolean);
  if (!parts.length) return '';
  return (parts[0][0] || '') + '|' + parts[parts.length - 1];
}
function guardHTML(mId, fId) {
  const m = get(mId), f = get(fId);
  if (!m || !f) return '';
  const sm = speciesOf(m), sf = speciesOf(f), out = [];
  if (sm && sf && spKey(sm) !== spKey(sf)) {
    out.push(`<div class="notice warn"><b>Different species.</b> ${h(shortName(m))} is listed as <i>${h(sm)}</i> and ${h(shortName(f))} as <i>${h(sf)}</i>. Crosses between species usually fail or give poor fertility, so check before you pollinate or pair.</div>`);
  }
  for (const r of m === f ? [m] : [m, f]) {
    if (speciesOf(r) && !verifiedOf(r)) out.push(`<div class="notice">Species for ${h(shortName(r))} isn't confirmed yet. Check the packet or breeder before relying on this cross.</div>`);
  }
  const missing = (m === f ? [m] : [m, f]).filter(r => !speciesOf(r));
  if (missing.length) out.push(`<div class="notice">No species recorded for ${missing.map(r => h(shortName(r))).join(' or ')}, so this cross can't be checked for compatibility.</div>`);
  return out.join('');
}

/* Lineage */
function parentsOf(r) {
  if (!r || r.type === 'strain') return [null, null];
  let m = r.motherId, f = r.fatherId;
  if (!m && !f && r.crossId) { const c = get(r.crossId); if (c) { m = c.motherId; f = c.fatherId; } }
  if (!m && !f && r.stockId) { const l = get(r.stockId); if (l) [m, f] = parentsOf(l).map(x => x?.id); }
  return [get(m) || null, get(f) || null];
}
function genOf(r) {
  if (!r) return null;
  if (r.type === 'strain') return 'P';
  if (r.type === 'individual') return r.generation ? r.generation.toUpperCase() : (r.strainId ? 'P' : null);
  return null;
}
const strainOfRec = r => (r?.type === 'strain' ? r.id : r?.strainId || '');
function suggestGen(m, f) {
  if (!m || !f) return '';
  const gm = genOf(m), gf = genOf(f);
  if (gm === 'P' && gf === 'P') return strainOfRec(m) && strainOfRec(m) === strainOfRec(f) ? '' : 'F1';
  const nm = /^F(\d+)$/.exec(gm || ''), nf = /^F(\d+)$/.exec(gf || '');
  if (nm && nf && nm[1] === nf[1]) return 'F' + (+nm[1] + 1);
  return '';
}
function suggestCode(projectId, gen, kind, exceptId) {
  const p = get(projectId);
  const prefix = (p?.code || 'TAG').replace(/\s+/g, '');
  const base = `${prefix}${gen ? '-' + gen.toUpperCase() : ''}-${kind === 'animal' ? 'A' : 'P'}`;
  const codes = new Set(all('individual').filter(i => i.id !== exceptId).map(i => (i.code || '').toUpperCase()));
  let n = 1; while (codes.has(base + pad(n))) n++;
  return base + pad(n);
}

/* Projects, targets and selection scores */
const TIER_W = { 1: 4, 2: 3, 3: 2, 4: 1 };
function projectTraits(p) {
  if (!p) return [];
  if (p.traits?.length) return p.traits;
  const par = get(p.parentId);
  return par && par !== p ? par.traits || [] : [];
}
function scoreOf(ind, traits) {
  let num = 0, den = 0, scored = 0; const flags = [];
  for (const t of traits) {
    const v = ind.scores?.[t.name]; if (v == null) continue;
    scored++; const w = TIER_W[t.tier] || 1;
    num += w * v; den += w * 5;
    if (t.must && v < 3) flags.push(t.name);
  }
  return { pct: den ? Math.round((num / den) * 100) : null, scored, total: traits.length, flags };
}
function projectFamily(p) { return [p.id, ...all('project').filter(x => x.parentId === p.id).map(x => x.id)]; }
function membersOf(p) { const ids = new Set(projectFamily(p)); return all('individual').filter(i => ids.has(i.projectId)); }
function crossesOf(p) { const ids = new Set(projectFamily(p)); return all('cross').filter(c => ids.has(c.projectId)); }

function coverOf(r) {
  const fromNotes = () => { for (const n of notesFor(r.id)) if (n.photoIds?.length) return n.photoIds[0]; return null; };
  if (r.type === 'individual') return fromNotes() || r.photoIds?.[0] || null;
  if (r.photoIds?.length) return r.photoIds[0];
  if (r.type === 'strain') { for (const l of all('stock')) if (l.strainId === r.id && l.photoIds?.length) return l.photoIds[0]; }
  return fromNotes();

const BACKUP_README = `LINEAGE BACKUP

This zip holds everything from Lineage on one device.

lineage.json      All records. Lineage reads this file to restore.
photos/           Every photo as a normal image file. File names start with
                  the date and what the photo is of.
photos/thumbs/    Small copies Lineage uses for lists.
readable/         Your records as spreadsheet files (CSV). Open them in
                  Excel, Google Sheets or LibreOffice to read your data
                  without the app.

To restore: open Lineage, go to Settings, choose "Restore or import a file"
and pick this zip. Do not unzip it first.
`;
async function buildZipBackup(onProgress) {
  const owner = new Map();
  const sorted = [...S.recs.values()].sort((a, b) => (a.deletedAt ? 1 : 0) - (b.deletedAt ? 1 : 0));
  for (const r of sorted) for (const pid of r.photoIds || []) if (!owner.has(pid)) {
    const about = r.type === 'note' ? get(r.refId) : r.type === 'entry' ? null : r;
    const label = r.type === 'entry' ? itemLabel(r) : about ? title(about) : 'note';
    owner.set(pid, `${r.date || today()}_${slug(label)}`);
  }
  const names = new Map();
  const photoMeta = [], files = [];
  for (const p of await DB.all('photos')) {
    if (!owner.has(p.id)) continue;
    const full = `photos/${owner.get(p.id)}_${p.id}.jpg`, thumb = `photos/thumbs/${p.id}.jpg`;
    names.set(p.id, full.slice(7));
    photoMeta.push({ id: p.id, at: p.at, full, thumb: p.thumb ? thumb : null });
    files.push({ name: full, data: p.full });
    if (p.thumb) files.push({ name: thumb, data: p.thumb });
  }
  const meta = { app: 'lineage', version: 2, format: 'zip', exportedAt: new Date().toISOString(), records: [...S.recs.values()], photos: photoMeta };
  const out = [{ name: 'lineage.json', data: JSON.stringify(meta), compress: true }, { name: 'README.txt', data: BACKUP_README, compress: true }, ...readableFiles(id => names.get(id)), ...files];
  const blob = await makeZip(out, onProgress);
  return { blob, name: `lineage-backup-${today()}.zip`, records: meta.records.filter(r => !r.deletedAt).length, photos: photoMeta.length };
}
async function readBackupFile(file) {
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (head[0] === 0x50 && head[1] === 0x4b) {
    const z = await openZip(file);
    const jb = await z.read('lineage.json');
    if (!jb) throw new Error('This zip is not a Lineage backup');
    const data = JSON.parse(await jb.text());
    return { data, photo: async p => ({ id: p.id, at: p.at, full: await z.read(p.full, 'image/jpeg'), thumb: p.thumb ? await z.read(p.thumb, 'image/jpeg') : null }) };
  }
  const data = JSON.parse(await file.text());
  return { data, photo: async p => ({ id: p.id, at: p.at, full: dataURLToBlob(p.full), thumb: p.thumb ? dataURLToBlob(p.thumb) : null }) };
}

/* ---------- Sheets and form fields ---------- */
function sheet(titleText, body) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-wrap';
  el.innerHTML = `<div class="sheet-back" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${h(titleText)}"><header class="sheet-head"><h2>${h(titleText)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></header><div class="sheet-body">${body}</div></section>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  requestAnimationFrame(() => el.classList.add('open'));
  hydrate(el);
  setTimeout(() => $('input:not([type=hidden]),select,textarea', el)?.focus({ preventScroll: true }), 260);
  return el;
}
function closeSheet() { $$('.sheet-wrap').forEach(e => e.remove()); }

const F = {
  text: (k, label, v, ph = '') => `<label class="fld"><span>${label}</span><input name="${k}" value="${h(v)}" placeholder="${h(ph)}"></label>`,
  area: (k, label, v, ph = '', rows = 3) => `<label class="fld"><span>${label}</span><textarea name="${k}" rows="${rows}" placeholder="${h(ph)}">${h(v)}</textarea></label>`,
  date: (k, label, v) => `<label class="fld"><span>${label}</span><input type="date" name="${k}" value="${h(v)}"></label>`,
  month: (k, label, v) => `<label class="fld"><span>${label}</span><input type="month" name="${k}" value="${h((v || '').slice(0, 7))}" placeholder="YYYY-MM"></label>`,
  select: (k, label, v, opts) => `<label class="fld"><span>${label}</span><select name="${k}">${opts.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${h(val)}" ${val === (v ?? '') ? 'selected' : ''}>${h(txt)}</option>`; }).join('')}</select></label>`,
  check: (k, label, v) => `<label class="chk"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}><span>${label}</span></label>`,
  ref: (k, label, v, groups, none = 'Unknown or none') => `<label class="fld"><span>${label}</span><select name="${k}"><option value="">${h(none)}</option>${groups.filter(g => g.items.length).map(g => `<optgroup label="${h(g.label)}">${g.items.map(([id, t]) => `<option value="${id}" ${id === v ? 'selected' : ''}>${h(t)}</option>`).join('')}</optgroup>`).join('')}</select></label>`,
};
const indItems = (exclude) => all('individual').filter(r => r.id !== exclude).sort(byCode).map(r => [r.id, r.code + (r.name ? ` (${r.name})` : '')]);
const strainItems = () => all('strain').sort(byName).map(r => [r.id, r.name]);
const projectItems = (exclude) => all('project').filter(r => r.id !== exclude).sort(byName).map(r => [r.id, (get(r.parentId) ? get(r.parentId).name + ': ' : '') + r.name]);
const lotItems = () => all('stock').sort((a, b) => title(a).localeCompare(title(b))).map(r => [r.id, title(r) + (r.batch ? ` (${r.batch})` : '')]);
const parentGroups = exclude => [{ label: 'Tagged plants and animals', items: indItems(exclude) }, { label: 'Varieties and breeds', items: strainItems() }];
const anyGroups = () => [{ label: 'Tagged plants and animals', items: indItems() }, { label: 'Varieties and breeds', items: strainItems() }, { label: 'Projects', items: projectItems() }, { label: 'Lots', items: lotItems() }, { label: 'Crosses', items: all('cross').sort(byDateDesc).map(c => [c.id, crossTitle(c) + (c.date ? `, ${fmtDate(c.date)}` : '')]) }];

function formData(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.type === 'radio') continue;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  }
  return o;
}
const photoField = (label = 'Photos') => `<div class="fld"><span>${label}</span><div class="ph-grid" data-phs></div><div class="actions" style="margin:8px 0 0"><button type="button" class="btn" data-ph="cam">${ic('camera')}Camera</button><button type="button" class="btn" data-ph="lib">${ic('image')}Gallery</button></div></div>`;
function mountPhotos(root, ids) {
  const st = { ids: [...(ids || [])] };
  const grid = $('[data-phs]', root);
  if (!grid) return st;
  const draw = () => { grid.innerHTML = st.ids.map(id => `<div class="ph-t"><img data-photo="${id}" alt=""><button type="button" class="ph-x" data-rmph="${id}" aria-label="Remove photo">${ic('x')}</button></div>`).join(''); hydrate(grid); };
  draw();
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-ph]');
    if (b) {
      const files = await pickFiles(b.dataset.ph === 'cam');
      busy(true);
      try { for (const f of files) st.ids.push(await addPhoto(f)); } catch (err) { toast(err.message); } finally { busy(false); }
      draw(); return;
    }
    const r = e.target.closest('[data-rmph]');
    if (r) { st.ids = st.ids.filter(x => x !== r.dataset.rmph); draw(); }
  });
  return st;
}
function formSheet(titleText, inner, { onSave, onDelete, saveLabel = 'Save' }) {
  const el = sheet(titleText, `<form class="frm" novalidate>${inner}<div class="actions sheet-actions"><button type="submit" class="btn primary">${saveLabel}</button>${onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : ''}</div></form>`);
  const form = $('form', el);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    try { await onSave(formData(form), form, el); } catch (err) { console.error(err); toast(err.message || 'That could not be saved'); }
  });
  if (onDelete) $('[data-del]', el).addEventListener('click', async () => {
    if (!confirm('Move this to the recycle bin? Its notes and records go with it. You can restore it for 30 days.')) return;
    const to = await onDelete(); closeSheet(); toast('Moved to the recycle bin');
    if (to && location.hash !== to) location.hash = to; else render();
  });
  return { el, form };
}
const isNew = (id) => !id;
function afterSave(rec, wasNew, msg) {
  closeSheet(); toast(msg || (wasNew ? 'Added' : 'Saved'));
  const to = link(rec);
  if (wasNew && rec.type !== 'note' && location.hash !== to) location.hash = to; else render();
}

/* ---------- Smart features ---------- */
const LABEL_PROMPT = `This photo shows a seed packet or a label for breeding stock (plants or animals).
Read it and reply with ONLY a JSON object, no other text, using exactly these keys:
{"name": "variety or breed name as printed",
 "kind": "plant" or "animal",
 "group": "common crop or animal type, e.g. Pumpkin, Tomato, Herb, Chicken",
 "species": "scientific name if printed, otherwise your best identification, otherwise empty",
 "speciesPrinted": true if the scientific name is printed on the label, else false,
 "origin": "seller, breeder or supplier",
 "batch": "batch or lot number",
 "year": "packed, harvest or purchase year",
 "bestBefore": "best-before or sow-by date as YYYY-MM, otherwise empty",
 "notes": "one or two short sentences of useful printed details such as days to maturity, growth habit or traits"}
Use an empty string for anything you cannot read.`;

function parseJSON(text) {
  const m = String(text || '').match(/\{[\s\S]*\}/);
  if (!m) throw new Error('The reply did not contain the expected details');
  return JSON.parse(m[0]);
}
async function callClaude(content, maxTokens = 1200) {
  const { apiKey, model } = S.settings;
  if (!apiKey) throw new Error('Add your API key in Settings');
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model || DEFAULT_MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content }] }),
    });
  } catch { throw new Error('No connection to Claude. Check your internet'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data?.error?.message || `Claude returned an error (${r.status})`);
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}
async function readLabel(photoId) {
  const p = await DB.get('photos', photoId);
  const b64 = (await blobToDataURL(p.full)).split(',')[1];
  return parseJSON(await callClaude([{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: LABEL_PROMPT }], 800));
}

function scanSheet() {

  const el = sheet('Scan a packet or label', `

  };

  const fill = o => {
    const vals = { name: o.name, kind: o.kind === 'animal' ? 'animal' : 'plant', group: o.group, species: o.species, origin: o.origin, batch: o.batch, year: o.year, bestBefore: /^\d{4}-\d{2}/.test(o.bestBefore || '') ? o.bestBefore.slice(0, 7) : '', notes: o.notes };
    for (const [k, v] of Object.entries(vals)) if (v && String(v).trim()) form.elements[k].value = String(v).trim();
    form.elements.speciesVerified.checked = !!o.speciesPrinted && !!o.species;
    updateMatch();
  };
  const manualBox = () => `<div class="manual"><b>Fill this in with your Claude or ChatGPT app</b><ol><li>Copy the instructions.</li><li>Start a chat in Claude or ChatGPT, attach the same photo and paste.</li><li>Copy the whole reply and paste it below.</li></ol><button type="button" class="btn" data-copyprompt>Copy instructions</button><textarea rows="4" placeholder="Paste the reply here" data-paste aria-label="Paste the reply"></textarea><button type="button" class="btn primary" data-fill>Fill in the form</button></div>`;
  el.addEventListener('click', async e => {
    if (e.target.closest('[data-copyprompt]')) { toast((await copyText(LABEL_PROMPT)) ? 'Instructions copied' : 'Copy failed. Select and copy by hand'); return; }
    if (e.target.closest('[data-fill]')) { try { fill(parseJSON($('[data-paste]', el).value)); toast('Form filled in. Check it, then save'); } catch (err) { toast(err.message); } return; }

  form.addEventListener('submit', async e => {

    closeSheet(); toast('Added to library');

  });
}

function contextSnapshot() {
  const nm = id => (get(id) ? title(get(id)) : undefined);
  const snap = {
    today: today(),
    projects: all('project').map(p => ({ name: p.name, code: p.code, partOf: nm(p.parentId), kind: p.kind, species: p.species, goal: p.goal, targets: (p.traits || []).map(t => `Tier ${t.tier}${t.must ? ' must-have' : ''}: ${t.name}`), founders: (p.strainIds || []).map(nm) })),
    varieties: all('strain').map(s => ({ name: s.name, kind: s.kind, group: s.group, species: s.species, speciesConfirmed: !!s.speciesVerified, origin: s.origin, description: s.description })),
    lots: all('stock').map(l => ({ lot: title(l), variety: nm(l.strainId), batch: l.batch, year: l.year, bestBefore: l.bestBefore, status: l.status, quantity: l.quantity, mother: nm(l.motherId), father: nm(l.fatherId) })),
    tagged: all('individual').map(i => ({ tag: i.code, name: i.name, variety: nm(i.strainId), project: nm(i.projectId), generation: i.generation, sex: i.sex, status: i.status, started: i.startDate, mother: nm(i.motherId), father: nm(i.fatherId), scores: i.scores })),
    crosses: all('cross').map(c => ({ date: c.date, mother: nm(c.motherId), father: nm(c.fatherId), method: c.method, status: c.status, result: c.outcome, project: nm(c.projectId) })),
    records: all('entry').sort(byDateAsc).slice(-600).map(e => { const { rt } = rtInfo(e.rtId); if (!rt) return null; const o = { tag: get(e.indId)?.code, type: rt.name, date: e.date }; if (rt.itemName) o.item = `${rt.itemName} ${e.seq}`; const par = get(e.parentEntryId); if (par) o.of = itemLabel(par); for (const f of rt.fields || []) { const v = fieldValue(e, f, rt); if (v != null && v !== '') o[f.label] = v; } if (e.notes) o.notes = e.notes; return o; }).filter(Boolean),
    notes: all('note').sort(byDateDesc).slice(0, 200).map(n => ({ date: n.date, about: nm(n.refId), text: n.text, photos: n.photoIds?.length || 0 })),
  };
  return JSON.stringify(snap).slice(0, 150000);
}
const askPrompt = q => `You are a practical plant and animal breeding assistant. Here are my breeding records as JSON:\n<records>\n${contextSnapshot()}\n</records>\n\nAnswer my question using these records. Be practical and concise, name specific tags, varieties and lots, and say plainly if the records don't contain enough to answer.\n\nQuestion: ${q}`;
function renderAnswer(t) {
  return h(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>');
}

/* ---------- Backup ---------- */
function usedPhotoIds() { const s = new Set(); for (const r of S.recs.values()) (r.photoIds || []).forEach(x => s.add(x)); return s; }
function changesSinceBackup() {
  const t = Math.max(S.settings.lastExport || 0, S.settings.lastQuick || 0); let n = 0;
  for (const r of S.recs.values()) if ((r.updatedAt || 0) > t) n++;
  return n;
}
async function saveOrShare(blob, name, mime, how) {
  const file = new File([blob], name, { type: mime });
  if (how === 'share') { await navigator.share({ files: [file], title: 'Lineage backup', text: `Lineage backup, ${today()}` }); return; }
  if ('showSaveFilePicker' in window) {
    const ext = name.split('.').pop();
    const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Lineage backup', accept: { [mime]: ['.' + ext] } }] });
    const w = await handle.createWritable(); await w.write(blob); await w.close(); return;
  }
  download(blob, name);
}
async function doExport() {
  busy(true);
  let b;
  try { b = await buildZipBackup((n, t) => toast(`Packing ${n} of ${t} files`)); } catch (e) { busy(false); toast(e.message); return; }
  busy(false);
  const quick = new Blob([JSON.stringify({ app: 'lineage', version: 2, format: 'records', exportedAt: new Date().toISOString(), records: [...S.recs.values()], photos: [] })], { type: 'application/json' });
  const quickName = `lineage-records-${today()}.json`;
  const canShareZip = !!(navigator.canShare && navigator.canShare({ files: [new File([b.blob], b.name, { type: 'application/zip' })] }));
  const canShareQuick = !!(navigator.canShare && navigator.canShare({ files: [new File([quick], quickName, { type: 'application/json' })] }));
  const canPick = 'showSaveFilePicker' in window;
  const mb = n => (n / 1048576).toFixed(n > 1048576 ? 1 : 2);
  const el = sheet('Your backup is ready', `
    <p><b>Full backup:</b> ${b.records} record${b.records === 1 ? '' : 's'} and ${b.photos} photo${b.photos === 1 ? '' : 's'}, ${mb(b.blob.size)} MB, in <b>${h(b.name)}</b>.</p>
    <p class="muted">Keep at least one copy off this device: a USB stick, SD card, computer, or cloud drive. Don't unzip it; Lineage restores straight from the zip.</p>
    <div class="cap-list">
      ${canShareZip ? `<button type="button" class="cap-item" data-bk="share-zip">${ic('library')}<span><b>Send full backup to Drive, email or another app</b><small>Opens your device's share options</small></span></button>` : ''}
      <button type="button" class="cap-item${canShareZip ? ' plain' : ''}" data-bk="save-zip">${ic('note')}<span><b>${canPick ? 'Save full backup to a drive or folder' : 'Save full backup to this device'}</b><small>${canPick ? 'Choose a USB stick, SD card or any folder' : 'Goes to Downloads. From there, copy it to a USB stick or SD card with the Files app, or upload it to Google Drive'}</small></span></button>
    </div>
    ${canShareQuick ? `<h3 style="margin-top:18px">Quick backup</h3><p class="muted">Records only, no photos, ${mb(quick.size)} MB. Small enough to send to Drive or email after every session.</p><div class="cap-list"><button type="button" class="cap-item plain" data-bk="share-quick">${ic('note')}<span><b>Send records-only backup</b><small>Restores all records; photos come from your last full backup</small></span></button></div>` : ''}`);
  el.addEventListener('click', async e => {
    const btn = e.target.closest('[data-bk]'); if (!btn) return;
    const how = btn.dataset.bk;
    try {
      if (how === 'share-quick') { await saveOrShare(quick, quickName, 'application/json', 'share'); S.settings.lastQuick = Date.now(); }
      else { await saveOrShare(b.blob, b.name, 'application/zip', how === 'share-zip' ? 'share' : 'save'); S.settings.lastExport = Date.now(); }
      await saveSettings(); closeSheet(); toast('Backup saved'); render();
    } catch (err) {
      if (err?.name === 'AbortError') return;
      if (how.startsWith('share')) { download(how === 'share-quick' ? quick : b.blob, how === 'share-quick' ? quickName : b.name); toast('Sharing failed, so the backup was saved to this device instead'); return; }
      toast(err.message || 'The backup could not be saved');
    }
  });
}
async function doImport(file, replace) {
  const { data, photo } = await readBackupFile(file);
  if (data.app !== 'lineage' || !Array.isArray(data.records)) throw new Error('This file is not a Lineage backup');
  // Keep a copy of the current records so this restore can be undone
  const undoAt = Date.now();
  await DB.put('meta', { key: 'undo', at: undoAt, records: [...S.recs.values()] }); S.undoAt = undoAt;
  let photos = 0;
  for (const p of data.photos || []) { const ph = await photo(p); if (ph.full) { await DB.put('photos', ph); urlCache.delete(p.id + ':t'); urlCache.delete(p.id + ':f'); photos++; } }
  if (replace) { await DB.clear('records'); S.recs.clear(); }
  const now = Date.now(), put = [];
  let added = 0, updated = 0, kept = 0, same = 0;
  for (const r of data.records) {
    if ((r.updatedAt || 0) > now) r.updatedAt = now;
    if ((r.createdAt || 0) > now) r.createdAt = now;
    const cur = S.recs.get(r.id);
    if (!cur) added++;
    else if ((r.updatedAt || 0) > (cur.updatedAt || 0)) updated++;
    else { if ((r.updatedAt || 0) === (cur.updatedAt || 0)) same++; else kept++; continue; }
    put.push(r);
  }
  await DB.putMany('records', put);
  put.forEach(r => S.recs.set(r.id, r)); _noteIdx = null; _rtIdx = null;
  return [`${added} added`, `${updated} updated`, same && `${same} already up to date`, kept && `${kept} kept because this device's copy is newer`, photos && `${photos} photo${photos === 1 ? '' : 's'}`].filter(Boolean).join(', ');
}
async function undoRestore() {
  const u = await DB.get('meta', 'undo');
  if (!u) { toast('Nothing to undo'); return; }
  if (!confirm(`Put records back the way they were before the restore on ${new Date(u.at).toLocaleString()}?`)) return;
  await DB.clear('records'); S.recs.clear();
  await DB.putMany('records', u.records); u.records.forEach(r => S.recs.set(r.id, r));
  await DB.del('meta', 'undo'); S.undoAt = null; _noteIdx = null; _rtIdx = null;
  toast('Restore undone'); render();
}

/* ---------- Actions ---------- */
const P = el => { try { return JSON.parse(el.dataset.preset || '{}'); } catch { return {}; } };
const ACT = {
  back: () => (history.length > 1 ? history.back() : (location.hash = '#/')),
  capture: captureSheet,
  scan: () => scanSheet(),
  note: el => noteSheet({ refId: el.dataset.ref }),
  editNote: el => noteSheet({ id: el.dataset.id }),
  quickPhoto: el => quickPhoto(el.dataset.ref),
  newStrain: el => strainSheet({ preset: P(el) }), editStrain: el => strainSheet({ id: el.dataset.id }),
  newLot: el => lotSheet({ preset: P(el) }), editLot: el => lotSheet({ id: el.dataset.id }),
  newInd: el => indSheet({ preset: P(el) }), editInd: el => indSheet({ id: el.dataset.id }),
  newProject: el => projectSheet({ preset: P(el) }), editProject: el => projectSheet({ id: el.dataset.id }),
  newCross: el => crossSheet({ preset: P(el) }), editCross: el => crossSheet({ id: el.dataset.id }),
  photo: el => lightbox(el.dataset.photo),
  score: async el => {
    const i = get(el.dataset.id), t = el.dataset.trait, v = +el.dataset.v;
    i.scores = { ...(i.scores || {}) };
    if (i.scores[t] === v) delete i.scores[t]; else i.scores[t] = v;
    await save(i); render();
  },
  exportBackup: doExport,
  undoRestore,
  newEntry: el => entrySheet({ rtId: el.dataset.rt, indId: el.dataset.ind, parentEntryId: el.dataset.parent || '' }),
  editEntry: el => entrySheet({ id: el.dataset.id }),
  addRt: el => suggestSheet(el.dataset.project),
  editRt: el => recordTypeSheet({ rtId: el.dataset.rt }),
  bulk: el => bulkSheet({ projectId: el.dataset.project, rtId: el.dataset.rt }),
  binRestore: async el => { const n = await restoreBatch(el.dataset.batch); toast(`Restored ${n} record${n === 1 ? '' : 's'}`); render(); },
  binPurge: async el => { if (!confirm('Delete these records for good? This can’t be undone.')) return; await purgeBatch(el.dataset.batch); await cleanOrphanPhotos(); toast('Deleted for good'); render(); },
  importBackup: async el => {
    const [file] = await pickFiles(false, '.zip,.json,application/zip,application/json'); if (!file) return;
    const replace = el.dataset.mode === 'replace';
    if (replace && !confirm('Replace every record on this device with this backup?')) return;
    busy(true);
    try { const n = await doImport(file, replace); toast(`Restored: ${n}`); render(); } catch (e) { alert(e.message); } finally { busy(false); }
  },
  wipe: async () => {
    if (prompt('Type ERASE to delete every record and photo on this device.') !== 'ERASE') return;
    await DB.clear('records'); await DB.clear('photos'); await DB.del('meta', 'undo'); S.recs.clear(); urlCache.clear(); _noteIdx = null; _rtIdx = null; S.undoAt = null;
    toast('Everything erased'); location.hash = '#/'; render();
  },
  testAI: async () => {
    busy(true);
    try { await callClaude([{ type: 'text', text: 'Reply with the single word: ready' }], 10); toast('Connected to Claude'); }
    catch (e) { alert(e.message); } finally { busy(false); }
  },
  askRun: async () => {
    const q = $('#askQ').value.trim(); if (!q) { toast('Type a question first'); return; }
    const out = $('#askOut'); out.textContent = 'Thinking...'; busy(true);
    try { out.innerHTML = renderAnswer(await callClaude([{ type: 'text', text: askPrompt(q) }], 1500)); }
    catch (e) { out.textContent = e.message; } finally { busy(false); }
  },
  askCopy: async () => {
    const q = $('#askQ').value.trim(); if (!q) { toast('Type a question first'); return; }
    toast((await copyText(askPrompt(q))) ? 'Copied. Paste it into Claude or ChatGPT' : 'Copy failed on this browser');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el)).catch(err => { console.error(err); toast(err.message || 'Something went wrong'); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lb = $('.lb'); if (lb) { lb.remove(); return; }
  closeSheet();
});

/* ---------- Router ---------- */
const PAGES = { '': pHome, library: pLibrary, strain: pStrain, lot: pLot, tagged: pTagged, ind: pInd, projects: pProjects, project: pProject, cross: pCross, log: pLog, ask: pAsk, settings: pSettings, bin: pBin };
const TAB_OF = { '': 'home', library: 'library', strain: 'library', lot: 'library', tagged: 'tagged', ind: 'tagged', projects: 'projects', project: 'projects', cross: 'projects' };
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function render() {
  const { parts, q } = parseHash();
  const root = PAGES[parts[0]] ? parts[0] : '';
  const main = $('#main');
  let html;
  try { html = PAGES[root](parts[1], q); } catch (e) { console.error(e); html = `<div class="notice warn">This page hit a problem: ${h(e.message)}</div>`; }
  main.innerHTML = html;
  hydrate(main);
  const tab = TAB_OF[root];
  $$('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#backBtn').hidden = !parts[1] && !['log', 'ask', 'settings', 'bin'].includes(root);
  document.title = root ? `${(main.querySelector('h1')?.textContent || 'Lineage').trim()} | Lineage` : 'Lineage';
  mountPage(root);
}
function mountPage(root) {
  const main = $('#main');
  const filter = $('input[data-filter]', main);
  if (filter) filter.addEventListener('input', () => {
    const t = filter.value.toLowerCase().trim();
    $$('[data-s]', main).forEach(el => { el.hidden = !!t && !el.dataset.s.includes(t); });
    $$('[data-grp]', main).forEach(g => { g.hidden = !$$('[data-s]:not([hidden])', g).length; });
  });
  if (root === 'settings') {
    (async () => {
      const el = $('#storeInfo'); if (!el) return;
      try {
        const persisted = await navigator.storage?.persisted?.();
        const est = await navigator.storage?.estimate?.();
        const used = est?.usage ? `${(est.usage / 1048576).toFixed(1)} MB used on this device. ` : '';
        el.textContent = used + (persisted ? 'The browser has agreed not to clear this data on its own.' : 'The browser may clear this data if the device runs low on space, which is another reason to keep backups. Installing Lineage to your home screen usually changes this.');
      } catch {}
    })();
    $('#themeSel').addEventListener('change', async e => { S.settings.theme = e.target.value; applyTheme(); await saveSettings(); });
    const f = $('#aiForm');
    f.addEventListener('change', e => { if (e.target.name === 'ai') { $('#apiFields').hidden = e.target.value !== 'api'; $('#testBtn').hidden = e.target.value !== 'api'; } });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      S.settings.ai = f.querySelector('input[name=ai]:checked')?.value || 'off';
      S.settings.apiKey = f.elements.apiKey.value.trim();
      S.settings.model = f.elements.model.value.trim() || DEFAULT_MODEL;
      await saveSettings(); toast('Settings saved');
    });
  }
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- Start ---------- */
async function init() {
  $('#backBtn').innerHTML = ic('back');
  $('#logBtn').innerHTML = ic('log');
  $('#setBtn').innerHTML = ic('gear');
  $('.tabs .cap').innerHTML = ic('plus');
  for (const [tab, icon, label] of [['home', 'home', 'Home'], ['library', 'library', 'Library'], ['tagged', 'tag', 'Tagged'], ['projects', 'project', 'Projects']]) $(`.tabs a[data-tab="${tab}"]`).innerHTML = ic(icon) + label;
  try { await DB.open(); }
  catch {
    $('#main').innerHTML = '<div class="notice warn">This browser blocked local storage, so Lineage can\'t save records here. Try Chrome, Edge or Firefox, or open Lineage from a web address instead of a file.</div>';
    return;
  }
  const [recs, meta] = [await DB.all('records'), await DB.get('meta', 'settings')];
  recs.forEach(r => S.recs.set(r.id, r));
  if (meta) { const { key, ...rest } = meta; Object.assign(S.settings, rest); }
  S.undoAt = (await DB.get('meta', 'undo'))?.at || null;
  applyTheme();
  lastPath = location.hash.split('?')[0];
  render();
  purgeOldBin().catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
let lastPath = '';
window.addEventListener('hashchange', () => {
  closeSheet(); $('.lb')?.remove(); render();
  const path = location.hash.split('?')[0];
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
});
init();
</script>
